name: Deploy Docs to GitHub Pages

# WHEN this runs:
# - Every push to main that changes the docs folder
# - Manually, any time, from the Actions tab
on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
  workflow_dispatch:

# Grant just enough permission to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time, but don't cancel one mid-flight
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Upload the docs/ folder as the artifact that will be published
      - name: Upload docs folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
