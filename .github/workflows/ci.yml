name: CI - Lint & Test

# WHEN this workflow runs:
# - On every push to the main branch
# - On every pull request targeting main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    # Matrix strategy: run this same job on multiple Python versions
    # in parallel, so we know the app works everywhere, not just on
    # whatever version the developer happens to have locally.
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # 1. Pull the repository code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install the requested Python version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # 3. Install project + dev dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 4. Lint with flake8 - fails the build on real errors,
      #    only warns on style nits
      - name: Lint with flake8
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --statistics

      # 5. Check formatting with black (does not modify files, only checks)
      - name: Check formatting with black
        run: black --check app tests

      # 6. Run the test suite with coverage report
      - name: Run tests with pytest
        run: pytest --cov=app --cov-report=term-missing -v

      # 7. Upload coverage report as a downloadable artifact
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          if-no-files-found: ignore
