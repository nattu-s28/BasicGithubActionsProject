name: CodeQL Security Scan

# WHEN this runs:
# - On push/PR to main
# - Also on a weekly schedule, so newly discovered vulnerability
#   patterns get checked even if nobody pushes code that week
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC

jobs:
  analyze:
    name: Analyze Python code
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # required so results can be uploaded
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub's free, built-in static analysis security scanner.
      # It looks for real vulnerability patterns: SQL injection,
      # hardcoded secrets, unsafe deserialization, etc.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
