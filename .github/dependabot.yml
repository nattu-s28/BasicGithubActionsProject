version: 2
updates:
  # Keep Python dependencies (requirements.txt) up to date
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keep the GitHub Actions themselves up to date
  # (e.g. actions/checkout@v4 -> v5 when it releases)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
